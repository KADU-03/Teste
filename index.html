
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerar | Pagamento PIX</title>

<style>
:root {
  color-scheme: dark;
  --bg: #0c1020;
  --panel: #171d30;
  --line: #2c3551;
  --txt: #f7f9ff;
  --mute: #a5b2ce;
  --accent: #9d7bff;
  --ok: #47d9ad;
}

* {
  box-sizing: border-box;
}

body {
  background: radial-gradient(
    circle at 20% 0%,
    #25214e 0%,
    var(--bg) 48%
  );
  margin: 0;
  min-height: 100vh;
  color: var(--txt);
  font-family: system-ui, -apple-system, Segoe UI, sans-serif;
  display: grid;
  place-items: center;
  padding: 24px;
}

.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 24px;
  max-width: 500px;
  width: 100%;
  padding: 28px;
  box-shadow: 0 22px 80px #0007;
}

h1 {
  margin: 0 0 4px;
  font-size: 27px;
}

p {
  color: var(--mute);
  margin: 8px 0 20px;
  line-height: 1.5;
}

label {
  display: block;
  font-size: 13px;
  font-weight: 650;
  color: #cbd5ec;
  margin: 14px 0 7px;
}

input {
  width: 100%;
  padding: 14px 15px;
  border: 1px solid var(--line);
  background: #10162a;
  border-radius: 12px;
  font: inherit;
  color: var(--txt);
  outline: none;
}

input:focus {
  border-color: var(--accent);
}

button {
  border: 0;
  border-radius: 12px;
  padding: 14px;
  font: inherit;
  font-weight: 750;
  cursor: pointer;
}

button:disabled {
  opacity: 0.6;
  cursor: wait;
}

.primary {
  width: 100%;
  color: #100c20;
  background: linear-gradient(105deg, #a98bff, #70d8ec);
  margin-top: 18px;
}

.second {
  width: 100%;
  background: #303957;
  color: white;
  margin-top: 10px;
}

.money {
  display: flex;
  justify-content: space-between;
  border-bottom: 1px solid var(--line);
  padding: 10px 0;
}

.money:last-child {
  border: 0;
  font-weight: 800;
  font-size: 19px;
}

.amountbox {
  background: #111729;
  border: 1px solid var(--line);
  padding: 12px 16px;
  border-radius: 14px;
  margin-top: 17px;
}

.hint {
  font-size: 12px;
  color: var(--mute);
}

.status {
  padding: 12px;
  background: #232c48;
  border-radius: 12px;
  margin-top: 16px;
  font-size: 14px;
}

.success {
  background: #123f39;
  color: #9ff5ce;
}

.fail {
  background: #4b2632;
  color: #ffc0c8;
}

.qr {
  display: block;
  width: min(260px, 90%);
  height: auto;
  aspect-ratio: 1;
  background: white;
  padding: 10px;
  border-radius: 14px;
  margin: 20px auto;
}

.hidden {
  display: none;
}

.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
}

.tag {
  background: #3b2865;
  color: #d3c4ff;
  padding: 5px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 700;
}

.wrap {
  overflow-wrap: anywhere;
}

.foot {
  font-size: 11px;
  margin: 12px 0 0;
}

#copyPaste {
  font-size: 12px;
}
</style>
</head>

<body>

<main class="card">

  <div class="row">
    <h1>Gerar</h1>
    <span class="tag">PIX</span>
  </div>

  <p>
    Informe quanto deseja pagar. Será adicionada
    uma taxa fixa de R$ 1,00.
  </p>

  <section id="start">

    <label for="amount">Valor desejado (R$)</label>

    <input
      id="amount"
      inputmode="decimal"
      placeholder="Ex.: 10,00"
      autocomplete="off"
    >

    <div class="amountbox">

      <div class="money">
        <span>Valor escolhido</span>
        <strong id="baseDisplay">R$ 0,00</strong>
      </div>

      <div class="money">
        <span>Taxa de serviço</span>
        <strong>R$ 1,00</strong>
      </div>

      <div class="money">
        <span>Total a pagar</span>
        <strong id="totalDisplay">R$ 1,00</strong>
      </div>

    </div>

    <button class="primary" id="create">
      Gerar QR Code PIX
    </button>

  </section>

  <section id="payment" class="hidden">

    <div class="amountbox">

      <div class="money">
        <span>Valor</span>
        <strong id="payBase"></strong>
      </div>

      <div class="money">
        <span>Taxa fixa</span>
        <strong>R$ 1,00</strong>
      </div>

      <div class="money">
        <span>Total do PIX</span>
        <strong id="payTotal"></strong>
      </div>

    </div>

    <img
      class="qr hidden"
      id="qr"
      alt="QR Code PIX para pagamento"
    >

    <label for="copyPaste">
      PIX copia e cola
    </label>

    <input id="copyPaste" readonly>

    <button class="second" id="copy">
      Copiar código PIX
    </button>

    <div class="status" id="paymentStatus">
      Aguardando pagamento...
    </div>

    <p class="hint wrap" id="transactionRef"></p>

    <button class="second" id="new">
      Nova cobrança
    </button>

  </section>

  <div class="status hidden" id="notice" role="status"></div>

</main>

</body>
</html>
